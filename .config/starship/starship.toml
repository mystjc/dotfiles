format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
format = "[$path]($style) "
style = "bold blue"
truncate_to_repo = false

[git_branch]
format = "[$symbol $branch]($style)"
style = "bold purple"
symbol = "󰊢"

[git_status]
format = "[(•$conflicted$untracked$modified$staged$renamed$deleted) ($stashed$ahead_behind)]($style)"
style = "bold purple"
conflicted = "​"
ahead = "[↑${count} ](bold green)"
behind = "[↓${count} ](bold red)"
diverged = ""
untracked = "​"
stashed = "[≡ ](bold cyan)"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"

[cmd_duration]
format = "[$duration]($style)"
style = "yellow"
