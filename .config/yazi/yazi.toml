[mgr]
ratio          = [ 1, 2, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]

[preview]
wrap            = "no"
tab_size        = 4
max_width       = 1000
max_height      = 600
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75

[tasks]
bizarre_retry    = 5
suppress_preload = false
image_alloc      = 536870912  # 512MB
image_bound      = [ 0, 0 ]

[input]
cursor_blink = false

[which]
sort_by      	= "none"
sort_sensitive  = false
sort_reverse 	= false
sort_translit   = false
